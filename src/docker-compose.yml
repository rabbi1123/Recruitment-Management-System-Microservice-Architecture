version: '3.4'

services:
  candidatedb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: candidatedb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${Candidate_DB_PASSWORD}
      Candidate_DB_PASSWORD: ${Candidate_DB_PASSWORD}
    restart: always
    ports:
      - "1436:1433"
    volumes:
      - candidatedb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$Candidate_DB_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      candidatedb:
        condition: service_healthy
    environment:
      Candidate_DB_PASSWORD: ${Candidate_DB_PASSWORD}
      DB_HOST: candidatedb
    volumes:
      - ./docker/db/init-db.sh:/init-db.sh:ro
      - ./Services/Candidate/WebAPI/Candidate.WebAPI/DB/CandidateService.sql:/scripts/CandidateService.sql:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  candidate.webapi:
    image: ${DOCKER_REGISTRY-}candidatewebapi
    build:
      context: .
      dockerfile: Services/Candidate/WebAPI/Candidate.WebAPI/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      Candidate_DB_PASSWORD: ${Candidate_DB_PASSWORD}
    volumes:
      - candidate_uploads:/app/uploads

  organizationdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: organizationdb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${Organization_DB_PASSWORD}
      Organization_DB_PASSWORD: ${Organization_DB_PASSWORD}
    restart: always
    ports:
      - "1437:1433"
    volumes:
      - organizationdb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$Organization_DB_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  organization-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      organizationdb:
        condition: service_healthy
    environment:
      Organization_DB_PASSWORD: ${Organization_DB_PASSWORD}
      DB_HOST: organizationdb
    volumes:
      - ./docker/db/init-organization-db.sh:/init-db.sh:ro
      - ./Services/Organization/WebAPI/Organization.WebAPI/DB/OrganizationServiceDB.sql:/scripts/OrganizationServiceDB.sql:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  organization.webapi:
    image: ${DOCKER_REGISTRY-}organizationwebapi
    build:
      context: .
      dockerfile: Services/Organization/WebAPI/Organization.WebAPI/Dockerfile
    depends_on:
      organization-db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=organizationdb;Database=OrganizationDB;User Id=sa;Password=${Organization_DB_PASSWORD};TrustServerCertificate=True"

  jobdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jobdb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${Job_DB_PASSWORD}
      Job_DB_PASSWORD: ${Job_DB_PASSWORD}
    restart: always
    ports:
      - "1438:1433"
    volumes:
      - jobdb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$Job_DB_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  job-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      jobdb:
        condition: service_healthy
    environment:
      Job_DB_PASSWORD: ${Job_DB_PASSWORD}
      DB_HOST: jobdb
    volumes:
      - ./docker/db/init-job-db.sh:/init-db.sh:ro
      - ./Services/Job/WebAPI/Job.WebAPI/DB/JobServiceDB.sql:/scripts/JobServiceDB.sql:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  job.webapi:
    image: ${DOCKER_REGISTRY-}jobwebapi
    build:
      context: .
      dockerfile: Services/Job/WebAPI/Job.WebAPI/Dockerfile
    depends_on:
      job-db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=jobdb;Database=JobDB;User Id=sa;Password=${Job_DB_PASSWORD};TrustServerCertificate=True"

  recruitmentdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitmentdb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${Recruitment_DB_PASSWORD}
      Recruitment_DB_PASSWORD: ${Recruitment_DB_PASSWORD}
    restart: always
    ports:
      - "1439:1433"
    volumes:
      - recruitmentdb_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$Recruitment_DB_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  recruitment-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    depends_on:
      recruitmentdb:
        condition: service_healthy
    environment:
      Recruitment_DB_PASSWORD: ${Recruitment_DB_PASSWORD}
      DB_HOST: recruitmentdb
    volumes:
      - ./docker/db/init-recruitment-db.sh:/init-db.sh:ro
      - ./Services/Recruitment/WebAPI/Recruitment.WebAPI/DB/RecruitmentServiceDB.sql:/scripts/RecruitmentServiceDB.sql:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]
    restart: "no"

  recruitment.webapi:
    image: ${DOCKER_REGISTRY-}recruitmentwebapi
    build:
      context: .
      dockerfile: Services/Recruitment/WebAPI/Recruitment.WebAPI/Dockerfile
    depends_on:
      recruitment-db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: "Server=recruitmentdb;Database=RecruitmentDB;User Id=sa;Password=${Recruitment_DB_PASSWORD};TrustServerCertificate=True"

volumes:
  candidatedb_data:
  candidate_uploads:
  organizationdb_data:
  jobdb_data:
  recruitmentdb_data:



